# Development tools and tasks. Run `bin/mise install` to set up, and
# `bin/mise run check` before pushing. bin/mise downloads a pinned mise
# on first use, so contributors don't need to install it.

[settings]
# Read the Rust version from rust-toolchain.toml, so it is pinned in one place.
idiomatic_version_file_enable_tools = ["rust"]

[tools]
hk = "2.13.0"
# Installed on first use (`git review`), not by `mise install`, so CI skips it.
"pipx:git-review" = { version = "2.5.0", lazy = true, lazy_bins = ["git-review"] }
"aqua:EmbarkStudios/cargo-deny" = "0.21.0"
# Installed on first use (`cargo fuzz`), not by `mise install`, so CI's
# check skips it. The fuzz workflow installs it by name.
"cargo:cargo-fuzz" = { version = "0.13.2", lazy = true, lazy_bins = ["cargo-fuzz"] }
jouet = { version = "latest", workflow = "release.yml@refs/heads/main" }

[tasks.build]
description = "Build every crate"
run = "cargo build --workspace --all-targets"

[tasks.test]
description = "Run every crate's tests, the native debugger tests with native frames on, the library tests on artifacts, the library and bridge tests unoptimised, and the regressions and conformance suites unoptimised"
run = [
    # Not the examples: they have no tests, linking them costs time, and
    # Clippy (`lint`) already checks they compile. Naming the targets turns
    # doctests off, so those run on their own.
    "cargo test --workspace --lib --bins --tests",
    "cargo test --workspace --doc",
    "cargo test -p vali-runtime --features native-frames --test debugger",
    # `--workspace`, not `-p vali-compiler`, so features resolve as in the
    # first run and these reuse its build: the variables are read at run time.
    # The library and bridge tests are modules of vali-compiler's `it` binary.
    "VALI_ROUND_TRIP=1 cargo test --workspace --test it -- libraries::",
    "VALI_NO_OPT=1 cargo test --workspace --test it -- libraries:: bridges::",
    "VALI_NO_OPT=1 cargo test --workspace --test regressions",
    "VALI_NO_OPT=1 cargo test --workspace --test conformance",
]

[tasks.test-debugger-optimised]
description = "Run the native debugger tests on an optimised build with full debug info, where the interpreter's locals are hardest to read (needs gdb and lldb on Linux)"
env = { CARGO_PROFILE_RELEASE_DEBUG = "2" }
run = "cargo test -p vali-runtime --release --features native-frames --test debugger"

[tasks.lint]
description = "Check formatting and run Clippy with warnings as errors"
run = [
    "cargo fmt --all --check",
    "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks.docs]
description = "Build the documentation, with broken links as errors"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --no-deps --workspace"

[tasks.deny]
description = "Check dependency licences, sources and bans (ADR 0011)"
run = "cargo deny check"

[tasks.check]
description = "Everything CI runs: lint, test, documentation and dependency checks"
depends = ["lint", "test", "test-debugger-optimised", "docs", "deny"]

[tasks.bench]
description = "Run benchmarks/: exact counts, then the median of 9 timed runs, into target/vali-bench/latest"
run = [
    "cargo run --release -q -p vali-bench --features counters -- count",
    "cargo run --release -q -p vali-bench -- time",
]

[tasks.bench-compare]
description = "Compare two benchmark result directories: bin/mise run bench-compare OLD NEW"
run = "cargo run --release -q -p vali-bench -- compare"
