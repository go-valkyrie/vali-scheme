# Development tools and tasks. Run `bin/mise install` to set up, and
# `bin/mise run check` before pushing. bin/mise downloads a pinned mise
# on first use, so contributors don't need to install it.
#
# This file holds the tools every use needs: hk, which checks commit
# messages. The Rust toolchain and the other development tools are in the
# development environment, mise.development.toml, which .miserc.toml turns
# on. With MISE_ENV set empty, as CI's commit-message check runs, mise
# installs hk alone.

[tools]
hk = "2.13.0"

[tasks.build]
description = "Build every crate"
run = "cargo build --workspace --all-targets"

[tasks.test]
description = "Run every crate's tests, the native debugger tests with native frames on, the library tests on artifacts, the whole `it` binaries, regressions and conformance suites unoptimised, and again with every function converted as its library loads"
run = [
    # Not the examples: they have no tests, linking them costs time, and
    # Clippy (`lint`) already checks they compile. Naming the targets turns
    # doctests off, so those run on their own.
    "cargo test --workspace --lib --bins --tests",
    "cargo test --workspace --doc",
    "cargo test -p vali-runtime --features native-frames --test debugger",
    # `--workspace`, not `-p vali-compiler`, so features resolve as in the
    # first run and these reuse its build: the variables are read at run time.
    # The library and bridge tests are modules of vali-compiler's `it` binary.
    "VALI_ROUND_TRIP=1 cargo test --workspace --test it -- libraries::",
    # The unoptimised pass runs every test in the `it` binaries; a test that
    # asserts on optimiser output skips itself when `VALI_NO_OPT` is set.
    "VALI_NO_OPT=1 cargo test --workspace --test it",
    "VALI_NO_OPT=1 cargo test --workspace --test regressions",
    "VALI_NO_OPT=1 cargo test --workspace --test conformance",
    # Libraries convert to bytecode as their functions are first called; the
    # eager pass converts them whole as they load, so every other test also
    # runs on code converted the other way.
    "VALI_EAGER=1 cargo test --workspace --test it",
    "VALI_EAGER=1 cargo test --workspace --test regressions",
    "VALI_EAGER=1 cargo test --workspace --test conformance",
]

[tasks.test-debugger-optimised]
description = "Run the native debugger tests on an optimised build, with full debug info, where the interpreter's locals are hardest to read, and with line tables only, where there are none (needs gdb and lldb on Linux)"
run = [
    "CARGO_PROFILE_RELEASE_DEBUG=2 cargo test -p vali-runtime --release --features native-frames --test debugger",
    "CARGO_PROFILE_RELEASE_DEBUG=line-tables-only VALI_TEST_DEBUG_INFO=line-tables cargo test -p vali-runtime --release --features native-frames --test debugger",
]

[tasks.lint]
description = "Check formatting and run Clippy with warnings as errors"
run = [
    "cargo fmt --all --check",
    "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks.docs]
description = "Build the documentation, with broken links as errors"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --no-deps --workspace"

[tasks.deny]
description = "Check dependency licences, sources and bans (ADR 0011)"
run = "cargo deny check"

[tasks.check]
description = "Everything CI runs: lint, test, documentation and dependency checks"
depends = ["lint", "test", "test-debugger-optimised", "docs", "deny"]

[tasks.bench]
description = "Run benchmarks/: exact counts, then the median of 9 timed runs, into target/vali-bench/latest"
run = [
    "cargo run --release -q -p vali-bench --features counters -- count",
    "cargo run --release -q -p vali-bench -- time",
]

[tasks.bench-compare]
description = "Compare two benchmark result directories: bin/mise run bench-compare OLD NEW"
run = "cargo run --release -q -p vali-bench -- compare"
