# Verifies changes under review on GerritHub, votes Verified on them, and
# reviews them with Muse Code.
#
# The gerrithub-ci Worker (https://github.com/go-valkyrie/gerrithub-ci) sends
# a repository_dispatch for each patch set it has confirmed with Gerrit: new
# patch sets from trusted uploaders, and anyone's patch set once a trusted
# reviewer comments "recheck". This workflow runs the checks (checks.yml) on
# the patch set, fetched from GerritHub, and reports the result to the
# Worker, which votes with its own Gerrit account. checks.yml decides which
# checks the patch set needs; one that only touches files the checks never
# read gets just its commit message checked, and is verified on that.
#
# GitHub holds no GerritHub credentials. Only the vote, review and
# post-review jobs may request an OIDC token, which is how they prove
# themselves to the Worker; the jobs that run the change's code get no
# secrets, and no token but the review job's read-only one, which reads
# only what is public. They restore the Rust caches but never save them,
# so a patch set can't poison the caches main's CI uses.
#
# Needs the repository variable GERRITHUB_CI_URL, the Worker's URL.

name: gerrit-verify
# repository_dispatch runs always show the default branch; name them after
# the change instead. Only fields the Worker validated: numbers and Gerrit's
# change kind (older Workers sent the trigger), never the change's own text.
run-name: "Gerrit ${{ github.event.client_payload.change }},${{ github.event.client_payload.patchset }} (${{ github.event.client_payload.change_kind || github.event.client_payload.trigger }})"

on:
  repository_dispatch:
    types: [gerrit-verify]

permissions:
  contents: read

concurrency:
  group: gerrit-${{ github.event.client_payload.change }}
  cancel-in-progress: true

env:
  # Where to fetch the patch set: the Worker sends the project's Gerrit URL.
  # Older Workers sent the project's name instead.
  REPO_URL: ${{ github.event.client_payload.repo_url || format('https://review.gerrithub.io/{0}', github.event.client_payload.project) }}
  REF: ${{ github.event.client_payload.ref }}
  REVISION: ${{ github.event.client_payload.revision }}
  # jouet is a development aid, not needed to check the code.
  MISE_DISABLE_TOOLS: jouet
  CARGO_TERM_COLOR: always
  # As in checks.yml, so the review job's rust-cache key matches the test
  # cache it restores.
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      repo-url: ${{ github.event.client_payload.repo_url || format('https://review.gerrithub.io/{0}', github.event.client_payload.project) }}
      ref: ${{ github.event.client_payload.ref }}
      revision: ${{ github.event.client_payload.revision }}
      check-commit-message: true

  vote:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      # Says what this job reports, which runs whatever the checks' result.
      - name: Link the change
        env:
          CHANGE: ${{ github.event.client_payload.change }}
          PATCHSET: ${{ github.event.client_payload.patchset }}
          RESULT: ${{ needs.checks.result }}
        run: |
          # REPO_URL is https://<host>/<project>; the change's page is
          # https://<host>/c/<project>/+/<change>/<patch set>.
          path=${REPO_URL#*://*/}
          host=${REPO_URL%"/$path"}
          if [ "$RESULT" = success ]; then verdict=Verified; else verdict="Not verified ($RESULT)"; fi
          printf '%s: [change %s, patch set %s](%s/c/%s/+/%s/%s) at revision %s.\n' \
            "$verdict" "$CHANGE" "$PATCHSET" "$host" "$path" "$CHANGE" "$PATCHSET" "$REVISION" >> "$GITHUB_STEP_SUMMARY"

      - name: Report the result to gerrithub-ci
        env:
          RESULT: ${{ needs.checks.result }}
          TICKET: ${{ github.event.client_payload.ticket }}
          WORKER: ${{ vars.GERRITHUB_CI_URL }}
        run: |
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=gerrithub-ci" | jq -r .value)
          jq -n --arg ticket "$TICKET" --arg result "$RESULT" '{ticket: $ticket, result: $result}' |
          curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            --data @- "$WORKER/vote"

  # Asks Muse Code to review the patch set, through gerrithub-ci, which holds
  # the LLM key: the job gets a short-lived token for this patch set alone
  # (POST /muse-token), Muse calls the LLM through the Worker's /v1 proxy,
  # and post-review posts what Muse answers (POST /review). A trivial rebase
  # or an unchanged patch set has nothing new to review, so it is skipped
  # here, and the Worker refuses a token for one anyway (409).
  #
  # Muse works in a checkout of main, with the patch set fetched in as a
  # commit it reads through git. So everything Muse takes as instructions is
  # main's: AGENTS.md, the gerrit-review skill (.claude/skills) and the mise
  # configuration Muse comes from. The change is only ever material to
  # review, which is why the workspace can be trusted.
  #
  # Anyone's patch set can reach this job through a "recheck", and Muse
  # builds and runs the change to probe it. So once the change's code can
  # run, nothing in this job can get a token: the review token is minted
  # first and is then only in Muse's memory, and every later step has no way
  # to ask for an OIDC token. Muse's shell runs in its sandbox (writes kept
  # to the workspace and a temporary directory) with the network open, and
  # Muse may search and fetch the web; nothing secret is in reach. Whatever
  # the sandbox may have written stays here: this job only uploads Muse's
  # answer and session, and post-review, on a runner of its own, reads them
  # as data. The worst a hostile patch set can do is steer its review and
  # use the runner until the timeout. Should that become a problem, reviews
  # can be started only by a trusted reviewer's comment, as "recheck" is.
  review:
    # It needs nothing from the other jobs, so it runs alongside them rather
    # than waiting for the tests: a review is most use when something is
    # wrong, so a patch set that fails them is reviewed too. !cancelled(),
    # not always(): a run that a newer patch set cancels must not go on to
    # review the patch set it replaced.
    if: >-
      !cancelled()
      && github.event.client_payload.change_kind != 'TRIVIAL_REBASE'
      && github.event.client_payload.change_kind != 'NO_CHANGE'
    runs-on: ubuntu-latest
    # Probes build the change, which takes a while on a cold cache.
    timeout-minutes: 45
    permissions:
      contents: read
      # For the gerrit-review skill's open-issues.sh: reading issues with
      # a token avoids the anonymous rate limit, which runners share.
      issues: read
      id-token: write
    outputs:
      review: ${{ steps.token.outputs.review }}
    env:
      TICKET: ${{ github.event.client_payload.ticket }}
      WORKER: ${{ vars.GERRITHUB_CI_URL }}
    steps:
      # With plain git, not actions/checkout: that action's cleanup runs at
      # the end of the job, after Muse, with the job's environment (an OIDC
      # token can be had there), and runs git in a workspace Muse's sandbox
      # could have written to. No action in this job runs anything from the
      # workspace after Muse; rust-cache saves nothing (save-if: false).
      - name: Check out main
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git init -q .
          git fetch -q --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$DEFAULT_BRANCH"
          git checkout -q FETCH_HEAD

      - name: Fetch the patch set
        run: |
          case "$REF" in refs/changes/[0-9][0-9]/*/*) ;; *) echo "bad ref: $REF"; exit 1 ;; esac
          # The commit and its parent, with no ref of their own: Muse is
          # given the hash. The working tree stays main's.
          git fetch -q --no-tags --depth=2 "$REPO_URL" "$REF"
          test "$(git rev-parse FETCH_HEAD)" = "$REVISION"

      # What the gerrit-review skill needs to probe the change, installed
      # beforehand so probes start quickly: main's development tools through
      # mise, the crates main builds with, and the Rust cache, restored into
      # target/, which Muse's scratch copy of the change links to so that only
      # what the change touches is rebuilt.
      #
      # mise and those tools, and Muse Code, come from the cache check.yml's
      # review-tools job saves on main, so they are downloaded only when
      # main's pinned versions change. Restored here and never saved, as
      # with the Rust cache, so a patch set can't poison it; restore has no
      # post step, so nothing runs after Muse.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ runner.arch }}-review-${{ hashFiles('bin/mise', 'mise.toml', 'mise.*.toml', '.miserc.toml', 'rust-toolchain.toml') }}

      - name: Install the development tools
        env:
          MISE_ENV: development
        run: |
          bin/mise install
          bin/mise exec -- cargo fetch --locked

      - uses: Swatinem/rust-cache@v2
        with:
          # check.yml's test job saves this cache on main; it is only read.
          shared-key: test
          save-if: false

      # Muse's shell sandbox on Linux is bubblewrap, which needs unprivileged
      # user namespaces; Ubuntu's AppArmor policy turns those off by default.
      - name: Let Muse's sandbox run
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install Muse Code
        env:
          MISE_ENV: review
        run: |
          bin/mise install
          echo "MUSE=$(bin/mise which muse)" >> "$GITHUB_ENV"

      # The last step that may ask for an OIDC token, and the last before the
      # change's code can run.
      - name: Get a review token from gerrithub-ci
        id: token
        run: |
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=gerrithub-ci" | jq -r .value)
          echo "::add-mask::$oidc"
          code=$(jq -n --arg ticket "$TICKET" '{ticket: $ticket}' |
            curl -sS -o "$RUNNER_TEMP/token.json" -w '%{http_code}' \
              -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' \
              --data @- "$WORKER/muse-token")
          if [ "$code" = 409 ]; then
            echo 'Nothing new to review.' >> "$GITHUB_STEP_SUMMARY"
            echo 'review=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$code" = 200
          # Masked in every later log line of the job, should anything echo it.
          echo "::add-mask::$(jq -r .token "$RUNNER_TEMP/token.json")"
          echo 'review=true' >> "$GITHUB_OUTPUT"

      - name: Review the patch set
        if: steps.token.outputs.review == 'true'
        # The review token lasts 30 minutes (gerrithub-ci's
        # MUSE_TOKEN_TTL_SECONDS); past that Muse's calls would fail anyway.
        timeout-minutes: 28
        env:
          # From here on nothing may ask GitHub for an OIDC token.
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          # The job's own token, for the skill's scripts. It reads only what
          # is public (contents and issues of a public repository), so the
          # change's code, which Muse's probes run, gains nothing by it but
          # a rate limit.
          GH_TOKEN: ${{ github.token }}
          CHANGE: ${{ github.event.client_payload.change }}
          PATCHSET: ${{ github.event.client_payload.patchset }}
        run: |
          # The Worker validated these as numbers and a commit hash, so the
          # command line holds nothing from the change itself.
          case "$CHANGE,$PATCHSET $REVISION" in
            *[!0-9a-f,\ ]*) echo "unexpected change, patch set or revision"; exit 1 ;;
          esac
          # The review token is read into memory and its file deleted before
          # Muse starts, so nothing Muse's shell runs can find it on disk.
          token=$(jq -r .token "$RUNNER_TEMP/token.json")
          rm -f "$RUNNER_TEMP/token.json"
          # Muse keeps a session log under this ID, which the next step
          # exports; stdout carries only the final answer.
          session=$(cat /proc/sys/kernel/random/uuid)
          echo "SESSION=$session" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/muse-review"
          # Muse sends its key only to an endpoint its settings name, with the
          # auth pinned; a --base-url flag alone gets no key. Its settings go
          # in a config directory of their own. Through this endpoint Muse
          # fetches its model catalog (/muse-code/models) and calls the model
          # (/v1/...), both of which gerrithub-ci proxies.
          config="$RUNNER_TEMP/muse-config"
          mkdir -p "$config/muse"
          jq -n --arg url "$WORKER/v1" \
            '{schema_version: 1, endpoint_transport: {base_url: $url, auth: "bearer"}}' \
            > "$config/muse/settings.json"
          # Muse's session log, followed alongside it, shows in this step's
          # log what Muse does as it does it. The model and the change write
          # that text, so GitHub reads none of it as a workflow command.
          # The viewer runs outside Muse's sandbox, which can write the
          # workspace, and bash reads a script as it runs it; so it runs from
          # copies made outside the workspace before Muse starts.
          viewer="$RUNNER_TEMP/muse-viewer"
          mkdir -p "$viewer"
          cp .github/review/watch-session.sh .github/review/session-log.jq "$viewer/"
          stop=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$stop"
          # (Its stderr would only say it was stopped.) It runs in a process
          # group of its own, which it leads, so stopping the group stops
          # every log it follows, a workflow's subagents' among them.
          setsid "$viewer/watch-session.sh" "$session" 2> /dev/null &
          watcher=$!
          # The token goes in on stdin, so it is in no environment or
          # command line; it is good for this patch set and a short while.
          status=0
          printf '%s' "$token" |
            XDG_CONFIG_HOME="$config" "$MUSE" exec \
              --api-key-stdin \
              --session-id "$session" \
              --output-schema .github/review/schema.json \
              --trust-workspace \
              --disable-approval \
              --contributor-mode on \
              --reasoning-effort xhigh \
              --sandbox-network enabled \
              --disable-request-user-input \
              --no-foreign-personal-context \
              --max-model-steps 200 \
              "/gerrit-review $CHANGE,$PATCHSET $REVISION" \
              > "$RUNNER_TEMP/muse-review/review.json" || status=$?
          # Let the viewer print the last of the log, then stop it.
          sleep 2
          kill -- -"$watcher" 2> /dev/null || true
          echo "::$stop::"
          exit "$status"

      # Muse's answer and session log, for post-review. Kept even when Muse
      # failed, to see why. A workflow's subagents are sessions of their own,
      # under the session's directory, so their logs go too.
      - name: Collect Muse's answer and session
        if: always() && steps.token.outputs.review == 'true' && env.SESSION != ''
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          out="$RUNNER_TEMP/muse-review"
          "$MUSE" export --session "$SESSION" --out "$out/session.json"
          session_dir=$(find "$HOME/.local/share/muse/sessions" -maxdepth 4 -type d -name "$SESSION" -print -quit 2>/dev/null || true)
          if [ -n "$session_dir" ] && [ -d "$session_dir/subagent" ]; then
            mkdir -p "$out/session-dir"
            cp -R "$session_dir/subagent" "$out/session-dir/"
          fi

      - name: Keep Muse's answer and session
        if: always() && steps.token.outputs.review == 'true' && env.SESSION != ''
        uses: actions/upload-artifact@v4
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        with:
          name: muse-review
          path: ${{ runner.temp }}/muse-review/
          retention-days: 30
          if-no-files-found: ignore

  # Posts Muse's review and renders its session, on a runner of its own, so
  # nothing the review job's sandbox wrote ever runs where an OIDC token can
  # be had: the renderer and the schema come from a fresh checkout of main,
  # and Muse's answer and session are only read, as data.
  post-review:
    needs: review
    if: >-
      !cancelled()
      && needs.review.outputs.review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      TICKET: ${{ github.event.client_payload.ticket }}
      WORKER: ${{ vars.GERRITHUB_CI_URL }}
    steps:
      - name: Check out main's review files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/review/

      - name: Fetch Muse's answer and session
        uses: actions/download-artifact@v4
        with:
          name: muse-review
          path: ${{ runner.temp }}/muse-review

      # Posted before anything else, so a failure to render can't lose it.
      # Gerrit refuses a whole review if one new comment is on a file the
      # patch set doesn't change, or if a reply to a patch-set-level thread
      # has a line, so those comments go into the summary instead. If Muse
      # gave no well-formed answer there is nothing to post; the session is
      # still rendered below, to show why.
      - name: Post the review to Gerrit
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHANGE: ${{ github.event.client_payload.change }}
          PATCHSET: ${{ github.event.client_payload.patchset }}
        run: |
          set -o pipefail
          review="$RUNNER_TEMP/muse-review/review.json"
          # Only a well-formed answer is posted.
          if ! jq -e '(.review | type == "string") and (.codeReview | IN(-1, 0, 1)) and (.comments | type == "array")' \
            "$review" > /dev/null 2>&1; then
            echo '::warning::Muse gave no review to post; see the session below.'
            echo 'Muse gave no review to post; the session page shows why.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$CHANGE,$PATCHSET" in *[!0-9,]*) echo "bad change or patch set"; exit 1 ;; esac
          project=${REPO_URL#*://*/}
          host=${REPO_URL%"/$project"}
          files=$(curl -fsS "$host/changes/${project//\//%2F}~$CHANGE/revisions/$PATCHSET/files" | tail -c +5 | jq -c 'keys')
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=gerrithub-ci" | jq -r .value)
          echo "::add-mask::$oidc"
          # The schema has every field and uses null for "none"; the Worker
          # takes Gerrit's names and no field at all for "none". A reply goes
          # on its parent's patch set (Gerrit takes it nowhere else), and
          # "resolved" is Gerrit's "unresolved", inverted. The footer says who
          # reviewed and where the whole session is.
          jq --arg ticket "$TICKET" --arg run "$RUN_URL" --argjson files "$files" '
            def postable: if .inReplyTo != null then .path != "/PATCHSET_LEVEL"
                          else (.path as $p | $files | index($p)) != null end;
            def where: "`\(.path)\(if .line then ":\(.line)" else "" end)`";
            ([.comments[] | select(postable)]) as $inline
            | ([.comments[] | select(postable | not)]) as $other
            | {ticket: $ticket,
               review: (.review
                 + (if ($other | length) > 0
                    then "\n\n**Notes that can'"'"'t go inline**\n"
                      + ([$other[] | "\n- \(where): \(.message | gsub("\n"; "\n  "))"] | join(""))
                    else "" end)
                 + "\n\n---\nReviewed by Muse Code with the gerrit-review skill. The whole session is on the run'"'"'s page: " + $run),
               codeReview,
               comments: [$inline[]
                 | {path, line, message, in_reply_to: .inReplyTo, patch_set: .patchSet,
                    unresolved: (if .resolved == null then null else (.resolved | not) end)}
                 | with_entries(select(.value != null))]}
            | if (.comments | length) == 0 then del(.comments) else . end' \
            "$review" |
            curl -fsS -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' \
              --data @- "$WORKER/review"

      # The session, readable in a browser: one self-contained HTML page,
      # uploaded unzipped so its link opens it in the browser, with a short
      # version in the run's summary.
      - name: Render Muse's session
        if: always()
        continue-on-error: true
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          CHANGE: ${{ github.event.client_payload.change }}
          PATCHSET: ${{ github.event.client_payload.patchset }}
        run: |
          in="$RUNNER_TEMP/muse-review"
          page="$RUNNER_TEMP/muse-session/muse-review-$CHANGE-$PATCHSET.html"
          mkdir -p "$RUNNER_TEMP/muse-session"
          python3 -I .github/review/render-session.py \
            "$in/session.json" "$in/review.json" \
            --html "$page" \
            --summary "$RUNNER_TEMP/summary.md" \
            --session-dir "$in/session-dir"
          echo "PAGE=$page" >> "$GITHUB_ENV"

      # With archive: false the artifact is the file itself, named after it,
      # and GitHub shows an HTML file in the browser. A name already used in
      # the run would be refused, so a re-run of this job replaces the page.
      - name: Keep the rendered session
        id: page
        if: always() && env.PAGE != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.PAGE }}
          archive: false
          overwrite: true
          retention-days: 30
          if-no-files-found: ignore

      - name: Summarise the review
        if: always()
        env:
          PAGE_URL: ${{ steps.page.outputs.artifact-url }}
        run: |
          if [ -n "$PAGE_URL" ]; then
            printf 'The whole session: [%s](%s)\n\n' "${PAGE##*/}" "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/summary.md" ]; then
            cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
