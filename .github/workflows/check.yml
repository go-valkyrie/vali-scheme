# Runs `mise run check` (formatting, Clippy, every test, documentation and
# dependency licences) on every pull request and every push to main. Other
# branches are checked through their pull requests, so a branch with one
# is not checked twice.
#
# A change only to files the check never reads skips it: prose, agent
# settings, and the fuzz targets, which fuzz.yml builds. Anything else,
# including a new directory, runs it. The two lists must stay the same.
name: check

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".claude/**"
      - ".jouet/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".claude/**"
      - ".jouet/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # jouet is a development aid, not needed to check the code.
      MISE_DISABLE_TOOLS: jouet
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install the pinned toolchain and cargo-deny
        run: bin/mise install
      - name: Check
        run: bin/mise run check
      # Recorded, not gated: compare runs with `bin/mise run bench-compare`.
      - name: Benchmarks
        run: bin/mise run bench
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: target/vali-bench/latest
