# Runs the checks (checks.yml: formatting, Clippy, every test, documentation
# and dependency licences) on every pull request and every push to main,
# plus the benchmarks. Other branches are checked through their pull
# requests, so a branch with one is not checked twice.
#
# A pull request that only changes files the checks never read skips them,
# and the benchmarks too; checks.yml holds the list. A push to main always
# runs everything: the checks test the tree, so a run on the newest commit
# covers every commit before it, and a newer push can cancel an older run
# without leaving anything unchecked. A batch of changes landing together
# costs one run. Every change was checked on its own under review already;
# main's run catches what changes do together. Runs here save the Rust
# caches, which gerrit-verify.yml's runs restore, so changes under review
# build on main's last cache.
name: check

on:
  push:
    branches: [main]
  pull_request:
  # A full run, by hand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      save-cache: ${{ github.event_name == 'push' }}
      check-all: ${{ github.event_name != 'pull_request' }}

  # Recorded, not gated: compare runs with `bin/mise run bench-compare`. It
  # waits for checks only to learn whether the commit changed any code, and
  # runs whether the checks pass or not.
  bench:
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: jouet
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench
      - name: Install the pinned toolchain
        run: bin/mise install
      - name: Benchmarks
        run: bin/mise run bench
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: target/vali-bench/latest
