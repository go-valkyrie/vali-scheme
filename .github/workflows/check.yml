# Runs the checks (checks.yml: formatting, Clippy, every test, documentation
# and dependency licences) on every pull request and every push to main,
# plus the benchmarks. Other branches are checked through their pull
# requests, so a branch with one is not checked twice.
#
# A pull request that only changes files the checks never read skips them,
# and the benchmarks too; checks.yml holds the list. A push to main always
# runs everything: the checks test the tree, so a run on the newest commit
# covers every commit before it, and a newer push can cancel an older run
# without leaving anything unchecked. A batch of changes landing together
# costs one run. Every change was checked on its own under review already;
# main's run catches what changes do together. Runs here save the Rust
# caches, which gerrit-verify.yml's runs restore, so changes under review
# build on main's last cache.
name: check

on:
  push:
    branches: [main]
  pull_request:
  # A full run, by hand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      save-cache: ${{ github.event_name == 'push' }}
      check-all: ${{ github.event_name != 'pull_request' }}

  # Recorded, not gated: compare runs with `bin/mise run bench-compare`. It
  # waits for checks only to learn whether the commit changed any code, and
  # runs whether the checks pass or not.
  bench:
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: jouet
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench
      # As in checks.yml, whose lint job saves this cache.
      - name: Read mise's pinned version
        id: mise
        run: echo "version=$(sed -n 's/.*MISE_VERSION:-\([0-9][0-9.]*\)}.*/\1/p' bin/mise | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Install the pinned toolchain
        uses: jdx/mise-action@v5
        with:
          version: ${{ steps.mise.outputs.version }}
          mise_env: development
          cache_key: mise-${{ runner.os }}-${{ runner.arch }}-development-${{ hashFiles('bin/mise', 'mise.toml', 'mise.*.toml', '.miserc.toml', 'rust-toolchain.toml') }}
          cache_save: false
      - name: Benchmarks
        run: mise run bench

  # Saves the tools gerrit-verify.yml's review job installs, which it only
  # restores: that job runs the change's code, so it must not write a cache
  # later runs trust. It installs them as the review job does, through
  # bin/mise, so the cache holds bin/mise's own mise too. Once the cache
  # holds the pinned versions this costs a restore; a version bump on main
  # fills a new one.
  review-tools:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: jouet
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ runner.arch }}-review-${{ hashFiles('bin/mise', 'mise.toml', 'mise.*.toml', '.miserc.toml', 'rust-toolchain.toml') }}
      - name: Install the review job's tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          MISE_ENV=development bin/mise install
          MISE_ENV=review bin/mise install
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.local/share/mise
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: target/vali-bench/latest
