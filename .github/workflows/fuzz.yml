# Fuzzes the bytecode validator and the VM with cargo-fuzz under
# AddressSanitizer, which needs a nightly toolchain. It runs on a schedule
# and on request, never as part of the check every push runs, so building
# Vali never needs nightly. The seeded test in crates/vali-test/tests/fuzz.rs
# runs the same generator on stable in every check.
name: fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bytecode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install a nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Fuzz for ten minutes
        run: cargo +nightly fuzz run bytecode -- -max_total_time=600
      - name: Keep what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
