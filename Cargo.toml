[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/go-valkyrie/vali-scheme"

[workspace.dependencies]
vali = { path = "crates/vali", version = "0.0.0" }
vali-abi = { path = "crates/vali-abi", version = "0.0.0" }
vali-bytecode = { path = "crates/vali-bytecode", version = "0.0.0" }
vali-compiler = { path = "crates/vali-compiler", version = "0.0.0" }
vali-dist = { path = "crates/vali-dist", version = "0.0.0" }
vali-macros = { path = "crates/vali-macros", version = "0.0.0" }
vali-num = { path = "crates/vali-num", version = "0.0.0" }
vali-opt = { path = "crates/vali-opt", version = "0.0.0" }
vali-runtime = { path = "crates/vali-runtime", version = "0.0.0" }
vali-stdlib = { path = "crates/vali-stdlib", version = "0.0.0" }
vali-syntax = { path = "crates/vali-syntax", version = "0.0.0" }

# The tests compile and run a lot of Scheme, most of it under every heap
# strategy and each time with the standard libraries compiled from source.
# Unoptimised, that took about eight minutes in CI; opt-level 1 makes the
# tests about seven times faster and keeps debug assertions and overflow
# checks. Only `cargo test` uses this profile, so builds stay unoptimised
# for debugging.
[profile.test]
opt-level = 1

# The debugger extensions in tools/debugger/ read the interpreter's
# locals from DWARF, so the runtime keeps full debug information in test
# builds even when CI asks for line tables only
# (CARGO_PROFILE_TEST_DEBUG): a per-package setting wins over that.
[profile.test.package.vali-runtime]
debug = "full"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
