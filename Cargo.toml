[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/go-valkyrie/vali-scheme"

[workspace.dependencies]
vali-abi = { path = "crates/vali-abi", version = "0.0.0" }
vali-bytecode = { path = "crates/vali-bytecode", version = "0.0.0" }
vali-compiler = { path = "crates/vali-compiler", version = "0.0.0" }
vali-num = { path = "crates/vali-num", version = "0.0.0" }
vali-runtime = { path = "crates/vali-runtime", version = "0.0.0" }
vali-syntax = { path = "crates/vali-syntax", version = "0.0.0" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
