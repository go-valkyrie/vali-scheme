[package]
name = "vali-runtime"
description = "Vali's runtime: values, memory strategies, objects, tasks and handles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
caseless = "0.2.2"
vali-abi.workspace = true
vali-bytecode.workspace = true
vali-macros.workspace = true
vali-num.workspace = true
vali-syntax.workspace = true

[features]
# Native debuggers and profilers walk interpreted frames (ADR 0004 #6): the
# interpreter keeps the entry trampoline's frame record pointing at the
# current Scheme frame, and each bytecode function gets a named marker stub.
# Off by default: keeping the link current costs up to about 10% on
# call-heavy code. Vali's GDB and LLDB extensions show Scheme frames without
# it.
native-frames = []
# Exact counts of what an isolate does (`Cx::counters`), for benchmarks.
# Off by default: it costs an increment per instruction.
counters = []
# Poison the parts of heap pages and stack segments nothing may touch, so
# AddressSanitizer sees inside Vali's own allocator. For fuzz builds under
# `-Zsanitizer=address` only: it needs the sanitizer's runtime to link.
asan = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
