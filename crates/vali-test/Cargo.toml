[package]
name = "vali-test"
description = "Vali's test harness: Scheme test files, the regression list, compliance suites and determinism checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
libtest-mimic = "0.8.2"
vali-bytecode.workspace = true
vali-compiler.workspace = true
vali-runtime.workspace = true
vali-stdlib.workspace = true
vali-syntax.workspace = true

[dev-dependencies]
vali-dist.workspace = true
vali-opt.workspace = true

[features]
# Lets AddressSanitizer see inside the runtime's pages and stack segments.
# For the fuzz build under `-Zsanitizer=address` only.
asan = ["vali-runtime/asan"]

[[test]]
name = "regressions"
harness = false

[lints]
workspace = true
