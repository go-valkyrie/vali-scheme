# Dependency policy for Vali, enforcing ADR 0011: dependencies of published
# crates must be under permissive licences compatible with MIT, and no
# copyleft dependencies are allowed.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.9
# The list above is policy, not an inventory: allowing a licence no current
# dependency uses is expected.
unused-allowed-license = "allow"

[licenses.private]
# Unpublished workspace crates, such as vali-test, are not distributed.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
